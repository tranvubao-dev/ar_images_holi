name: ar_images_holi
description: A Flutter plugin for handling image recognition on mobile platforms
version: 0.0.2
homepage: https://github.com/tranvubao-dev/ar_images_holi
repository: https://github.com/tranvubao-dev/ar_images_holi


environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.6'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8 
  stream_transform: ^2.1.0

dev_dependencies:
  async: 2.11.0
  build_runner: 2.4.9
  flutter_test:
    sdk: flutter
  lint_quido: 1.16.0
  mockito: 5.4.4


flutter:
  plugin:
    platforms:
      android:
        package: com.miquido.ar_quido
        pluginClass: ARQuidoPlugin
      ios:
        pluginClass: ARQuidoPlugin
